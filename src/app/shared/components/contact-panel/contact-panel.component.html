<section class="contact-panel" data-testid="contact-panel" aria-labelledby="contact-panel-title">
  <header class="contact-panel__header">
    <h3 id="contact-panel-title">{{ copy().contactPanelTitle }}</h3>
    <p>{{ copy().contactPanelBody }}</p>
  </header>

  @if (submitStatus() === 'success') {
    <div class="contact-panel__banner contact-panel__banner--success" role="status" data-testid="contact-panel-success">
      <svg class="banner-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
      <div class="banner-content">
        <h4 class="banner-title">{{ copy().contactSuccessTitle }}</h4>
        <p class="banner-body">{{ copy().contactSuccessBody }}</p>
      </div>
    </div>
  }

  @if (submitStatus() === 'error') {
    <div class="contact-panel__banner contact-panel__banner--error" role="alert" data-testid="contact-panel-error">
      <svg class="banner-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <div class="banner-content">
        <p class="banner-body">{{ copy().contactErrorMessage }}</p>
      </div>
    </div>
  }

  <div class="contact-panel__fields">
    <label for="contact-panel-name">
      <span>{{ copy().contactNameLabel }}</span>
      <input
        id="contact-panel-name"
        type="text"
        autocomplete="name"
        [value]="value().name"
        [placeholder]="copy().contactNamePlaceholder"
        [disabled]="isSubmitting()"
        [attr.aria-invalid]="errors().name ? 'true' : null"
        [attr.aria-describedby]="errors().name ? 'contact-panel-name-error' : null"
        (input)="setField('name', $any($event.target).value)"
      />
      @if (errors().name; as error) {
        <span id="contact-panel-name-error" class="contact-panel__error" role="alert">
          {{ error }}
        </span>
      }
    </label>

    <label for="contact-panel-email">
      <span>{{ copy().contactEmailFieldLabel }}</span>
      <input
        id="contact-panel-email"
        type="email"
        autocomplete="email"
        [value]="value().email"
        [placeholder]="copy().contactEmailPlaceholder"
        [disabled]="isSubmitting()"
        [attr.aria-invalid]="errors().email ? 'true' : null"
        [attr.aria-describedby]="errors().email ? 'contact-panel-email-error' : null"
        (input)="setField('email', $any($event.target).value)"
      />
      @if (errors().email; as error) {
        <span id="contact-panel-email-error" class="contact-panel__error" role="alert">
          {{ error }}
        </span>
      }
    </label>

    <label for="contact-panel-message">
      <span>{{ copy().contactMessageLabel }}</span>
      <textarea
        id="contact-panel-message"
        rows="6"
        [value]="value().message"
        [placeholder]="copy().contactMessagePlaceholder"
        [disabled]="isSubmitting()"
        [attr.aria-invalid]="errors().message ? 'true' : null"
        [attr.aria-describedby]="errors().message ? 'contact-panel-message-error' : null"
        (input)="setField('message', $any($event.target).value)"
      ></textarea>
      @if (errors().message; as error) {
        <span id="contact-panel-message-error" class="contact-panel__error" role="alert">
          {{ error }}
        </span>
      }
    </label>
  </div>

  <div class="contact-panel__actions">
    <button
      type="button"
      data-testid="contact-panel-whatsapp"
      class="contact-btn contact-btn--whatsapp"
      [disabled]="isSubmitting()"
      (click)="openChannel('whatsapp')"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="send-icon"
        aria-hidden="true"
      >
        <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
        <path d="m21.854 2.147-10.94 10.939" />
      </svg>
      {{ copy().contactWhatsAppActionLabel }}
    </button>
    <button
      type="button"
      data-testid="contact-panel-email"
      class="contact-btn contact-btn--email"
      [class.contact-btn--loading]="isSubmitting()"
      [disabled]="isSubmitting()"
      (click)="openChannel('email')"
    >
      @if (isSubmitting()) {
        <span class="spinner" aria-hidden="true"></span>
        <span>{{ copy().contactSendingLabel }}</span>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="send-icon"
          aria-hidden="true"
        >
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>
        <span>{{ copy().contactEmailActionLabel }}</span>
      }
    </button>
  </div>
</section>
