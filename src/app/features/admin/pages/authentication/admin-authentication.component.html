<main class="admin-authentication" data-testid="admin-authentication">
  <section class="admin-card" aria-labelledby="admin-title">
    <p class="eyebrow">Área administrativa</p>
    <h1 id="admin-title">Entrar</h1>
    <p class="description">Acesso restrito.</p>

    <form (ngSubmit)="submit()" novalidate>
      <label>
        <span>E-mail</span>
        <input
          name="email"
          type="email"
          autocomplete="username"
          required
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </label>

      <label>
        <span>Senha</span>
        <div class="password-wrapper">
          <input
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            required
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
          />
          <button
            type="button"
            class="password-toggle-btn"
            (click)="toggleShowPassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Exibir senha'"
            data-testid="toggle-password-visibility"
          >
            @if (showPassword()) {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            } @else {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </label>

      @if (errorMessage()) {
        <p class="error" role="alert" data-testid="admin-auth-error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
